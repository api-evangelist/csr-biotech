name: CSR Biotech
description: CSR Biotech (超视计 / Chaoshiji) is a Chinese life-sciences instrumentation
  company that develops super-resolution optical microscopy systems for advanced biological
  research. Its product line includes the HIS-SIM and MI-SIM structured-illumination
  microscopes and the SIM-Ultimate platform, delivering live-cell imaging down to roughly
  60nm resolution across many imaging modes. The company was surfaced as a portfolio
  company of Qiming Venture Partners and added to the API Evangelist network as a stub.
  As a scientific-instruments maker, CSR Biotech publishes no public developer portal,
  documentation, or API surface at this time; this profile captures its identity and
  domain-security posture.
